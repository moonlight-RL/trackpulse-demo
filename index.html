<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackPulse | 赋能下一代数字体验</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* 顶部导航 */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 50px; backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 24px; font-weight: 800; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 30px; height: 30px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 8px; }
        .nav-links button {
            background: transparent; border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 8px 20px; border-radius: 20px; cursor: pointer; transition: 0.3s;
        }
        .nav-links button:hover { background: rgba(255,255,255,0.1); }

        /* 主体内容 */
        .container { max-width: 1200px; margin: 80px auto; padding: 0 20px; text-align: center; }
        
        .hero-title {
            font-size: 64px; font-weight: 900; line-height: 1.1; margin-bottom: 20px;
            background: linear-gradient(to right, #60a5fa, #a78bfa, #f472b6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: fadeUp 0.8s ease-out;
        }
        .hero-subtitle {
            font-size: 20px; color: var(--text-muted); margin-bottom: 50px;
            animation: fadeUp 1s ease-out;
        }

        /* 按钮区 */
        .action-group { display: flex; justify-content: center; gap: 20px; margin-bottom: 80px; animation: fadeUp 1.2s ease-out; }
        .btn {
            padding: 16px 40px; border-radius: 50px; font-size: 18px; font-weight: 600;
            cursor: pointer; border: none; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; align-items: center; gap: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #6366f1); color: white;
            box-shadow: 0 10px 20px -10px rgba(59, 130, 246, 0.8);
        }
        .btn-primary:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 15px 25px -10px rgba(59, 130, 246, 1); }
        
        .btn-secondary {
            background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); transform: translateY(-3px); }

        /* 卡片展示区 */
        .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .card {
            background: var(--card-bg); backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.05); border-radius: 24px;
            padding: 40px; text-align: left; transition: all 0.4s ease;
            cursor: pointer; position: relative; overflow: hidden;
        }
        .card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(800px circle at var(--mouse-x) var(--mouse-y), rgba(255,255,255,0.06), transparent 40%);
            opacity: 0; transition: opacity 0.5s; pointer-events: none;
        }
        .card:hover::before { opacity: 1; }
        .card:hover { transform: translateY(-5px); border-color: rgba(99, 102, 241, 0.5); box-shadow: 0 20px 40px -20px rgba(0,0,0,0.5); }
        
        .card-icon { font-size: 32px; margin-bottom: 20px; }
        .card h3 { font-size: 22px; margin-bottom: 10px; font-weight: 700; }
        .card p { color: var(--text-muted); font-size: 15px; line-height: 1.6; }

        /* Toast 提示 */
        .toast-container { position: fixed; bottom: 30px; right: 30px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; }
        .toast {
            background: rgba(16, 185, 129, 0.9); color: white; padding: 16px 24px;
            border-radius: 12px; backdrop-filter: blur(10px); display: flex; align-items: center; gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2);
            animation: slideIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .toast.hiding { animation: slideOut 0.3s ease-in forwards; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { to { transform: translateX(100%); opacity: 0; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo"><div class="logo-icon"></div> TrackPulse Pro</div>
        <div class="nav-links">
            <button id="navBtn">登录控制台</button>
        </div>
    </nav>

    <main class="container">
        <h1 class="hero-title">重新定义数据洞察</h1>
        <p class="hero-subtitle">基于原生 Java Web 构建的企业级全链路埋点与用户行为分析平台</p>

        <div class="action-group">
            <button class="btn btn-primary" id="startBtn">
                <span>🚀</span> 开始免费试用
            </button>
            <button class="btn btn-secondary" id="demoBtn">
                <span>✨</span> 观看演示
            </button>
        </div>

        <div class="features-grid">
            <div class="card" data-event="view_realtime">
                <div class="card-icon">📊</div>
                <h3>实时大屏监控</h3>
                <p>毫秒级心跳上报机制，精准统计全天候 PV/UV 与实时在线人数，数据流转尽在掌控。</p>
            </div>
            <div class="card" data-event="view_funnel">
                <div class="card-icon">🔍</div>
                <h3>漏斗转化分析</h3>
                <p>自定义多步转化漏斗，精准定位业务流失节点，帮助企业快速优化转化策略。</p>
            </div>
            <div class="card" data-event="view_heatmap">
                <div class="card-icon">🔥</div>
                <h3>点击热力图</h3>
                <p>可视化还原用户真实点击轨迹，通过坐标映射技术，洞察页面哪个按钮最吸引眼球。</p>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <!-- ========================================== -->
    <!-- 核心：你的公网埋点 SDK 代码 -->
    <script src="https://2220f804.r24.cpolar.top/trackpulse/sdk/tp.js" data-site="8496f64a31bfd81aa4d11808a63881f6" async></script>
    <!-- ========================================== -->

    <script>
        // 1. 高级卡片悬浮光效
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('mousemove', e => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
            });
        });

        // 2. 封装 Toast 提示
        function showToast(message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<span>✅</span> <div>${message}</div>`;
            container.appendChild(toast);
            
            // 3秒后移除
            setTimeout(() => {
                toast.classList.add('hiding');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // 3. 交互与埋点触发逻辑
        document.getElementById('startBtn').addEventListener('click', () => {
            if (window.tp) tp.track('click_start_trial', { action: 'button' });
            showToast('体验数据已上送：开始免费试用');
        });

        document.getElementById('demoBtn').addEventListener('click', () => {
            if (window.tp) tp.track('watch_demo', { action: 'video' });
            showToast('体验数据已上送：观看演示');
        });

        document.getElementById('navBtn').addEventListener('click', () => {
            if (window.tp) tp.track('nav_login', { action: 'nav' });
            showToast('体验数据已上送：登录控制台');
        });

        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('click', function() {
                const eventName = this.getAttribute('data-event');
                if (window.tp) tp.track(eventName, { area: 'feature_card' });
                showToast(`体验数据已上送：点击卡片 (${eventName})`);
            });
        });
    </script>
</body>
</html>
